<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Green Leaf Admin Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #1b5e20,
                    #050505 45%,
                    #000000
                );

            color: white;

        }


        /* BACKGROUND CIRCLES */

        body::before {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            background: #2e7d32;

            border-radius: 50%;

            filter: blur(120px);

            opacity: .35;

            top: -100px;

            left: -100px;

        }


        body::after {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            background: #00c853;

            border-radius: 50%;

            filter: blur(130px);

            opacity: .20;

            bottom: -100px;

            right: -100px;

        }


        /* LOGIN BOX */

        .login-box {

            position: relative;

            width: 420px;

            max-width: 92%;

            padding: 45px 40px;

            background:

                rgba(20, 20, 20, .90);

            border:

                1px solid

                rgba(76, 175, 80, .35);

            border-radius: 20px;

            box-shadow:

                0 25px 70px

                rgba(0,0,0,.7),

                0 0 30px

                rgba(46,125,50,.15);

            backdrop-filter: blur(15px);

            z-index: 2;

        }


        /* LOGO */

        .logo {

            width: 75px;

            height: 75px;

            margin: 0 auto 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background:

                linear-gradient(
                    135deg,
                    #43a047,
                    #1b5e20
                );

            font-size: 35px;

            box-shadow:

                0 0 25px

                rgba(67,160,71,.45);

        }


        h1 {

            text-align: center;

            font-size: 28px;

            letter-spacing: 2px;

            color: white;

            margin-bottom: 7px;

        }


        .green {

            color: #4caf50;

        }


        .subtitle {

            text-align: center;

            color: #999;

            margin-bottom: 35px;

            font-size: 14px;

        }


        /* INPUT */

        .input-group {

            margin-bottom: 22px;

        }


        label {

            display: block;

            color: #ccc;

            font-size: 14px;

            margin-bottom: 8px;

        }


        input {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            background: #111;

            border:

                1px solid #333;

            border-radius: 10px;

            color: white;

            font-size: 15px;

            outline: none;

            transition: .3s;

        }


        input:focus {

            border-color: #4caf50;

            box-shadow:

                0 0 12px

                rgba(76,175,80,.2);

        }


        input::placeholder {

            color: #666;

        }


        /* LOGIN BUTTON */

        .login-btn {

            display: flex;

            justify-content: center;

            align-items: center;

            width: 100%;

            height: 52px;

            margin-top: 10px;

            background:

                linear-gradient(
                    135deg,
                    #43a047,
                    #1b5e20
                );

            color: white;

            border: none;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: .5px;

            cursor: pointer;

            transition: .3s;

            box-shadow:

                0 8px 20px

                rgba(46,125,50,.3);

        }


        .login-btn:hover {

            transform:

                translateY(-2px);

            box-shadow:

                0 12px 30px

                rgba(46,125,50,.5);

            background:

                linear-gradient(
                    135deg,
                    #66bb6a,
                    #2e7d32
                );

        }


        /* DEMO LOGIN */

        .demo {

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            background: #0d0d0d;

            border:

                1px solid #222;

            text-align: center;

            color: #888;

            font-size: 13px;

            line-height: 1.8;

        }


        .demo strong {

            color: #4caf50;

        }


        /* BACK WEBSITE */

        .back {

            display: block;

            margin-top: 25px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 13px;

            transition: .3s;

        }


        .back:hover {

            color: #4caf50;

        }


        /* FOOTER */

        .footer-text {

            text-align: center;

            margin-top: 25px;

            color: #555;

            font-size: 11px;

        }


        /* MOBILE */

        @media(max-width:500px) {

            .login-box {

                padding: 35px 25px;

            }

            h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        🌿

    </div>


    <!-- TITLE -->

    <h1>

        GREEN <span class="green">
            LEAF
        </span>

    </h1>


    <p class="subtitle">

        Nursery Admin Panel

    </p>


    <!-- USERNAME -->

    <div class="input-group">

        <label>

            Username

        </label>

        <input

            type="text"

            placeholder="Enter username"

        >

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

        <label>

            Password

        </label>

        <input

            type="password"

            placeholder="Enter password"

        >

    </div>


    <!-- LOGIN -->

    <a

        href="dashboard.html"

        class="login-btn"

    >

        LOGIN

    </a>


    <!-- DEMO -->

    <div class="demo">

        <strong>
            Demo Login
        </strong>

        <br>

        Username:

        <b>admin</b>

        <br>

        Password:

        <b>admin123</b>

    </div>


    <!-- BACK -->

    <a

        href="../index.html"

        class="back"

    >

        ← Back to Green Leaf Website

    </a>


    <div class="footer-text">

        © 2026 Green Leaf Nursery

    </div>


</div>


</body>

</html>
